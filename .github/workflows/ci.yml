name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # lexichunk is not on PyPI; pyproject pins it as a direct git reference, so pip
      # clones it here. This is what makes `pip install -e ".[dev]"` work on a clean
      # runner at all -- the previous version specifier resolved to a PyPI 404.
      - run: pip install -e ".[dev]"
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: make test

  gold-annotations:
    # The gold annotations are the harness's ground truth. If a fixture changes, every
    # span in gold/ silently becomes wrong, so validate them on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Validate gold annotations and query references
        run: python -m pytest tests/test_gold_annotations.py tests/test_query_annotations.py -q --no-cov
      # The README's results tables are generated from the committed run. If someone edits
      # them by hand, or replaces the run without regenerating, this catches it.
      - name: README results section matches the committed run
        run: make readme-check

  benchmark-smoke:
    # Structural benchmark only: no model downloads, runs in seconds. The retrieval
    # benchmark pulls sentence-transformer weights, so it is workflow_dispatch only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Structural benchmark
        run: make benchmark-structural
      - name: HTML report
        run: make report
      - uses: actions/upload-artifact@v4
        with:
          name: structural-benchmark
          path: results/
          if-no-files-found: error

  benchmark-retrieval:
    # Manual only: downloads embedding model weights (hundreds of MB) and takes minutes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[embeddings,dev]"
      - name: Full retrieval benchmark
        run: python -m scaffolder benchmark-embed --json --seed 42
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: results/
          if-no-files-found: error
