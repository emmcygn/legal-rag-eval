[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffolder"
version = "1.0.0"
description = "Evaluation harness proving LexiChunk improves RAG retrieval quality over general-purpose chunkers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SDK Scaffolder Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LexiChunk is not published on PyPI. Installing it by version specifier
    # ("lexichunk>=0.1.0,<1.0") fails with 404, which breaks `pip install -e .`
    # and every CI job. Pull it from source instead. To develop against a local
    # checkout, install it editable first and this direct reference is satisfied:
    #     pip install -e ../lexichunk && pip install -e ".[dev]"
    "lexichunk @ git+https://github.com/emmcygn/lexichunk.git@master",
    "langchain-text-splitters>=0.2.0,<1.0",
    "rich>=13.0,<14.0",
    "pyyaml>=6.0,<7.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<2.0",
    "jinja2>=3.1,<4.0",
    # scaffolder.reporting.html imports plotly at module scope and `scaffolder
    # report` is a documented command, so plotly is a core dependency, not a
    # dashboard-only one.
    "plotly>=5.18",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
]
voyage = [
    "voyageai>=0.2",
]
dashboard = [
    "streamlit>=1.30",
]
# External, public-dataset evaluations (scaffolder.evals). Kept optional so the
# core benchmark does not drag in Hugging Face `datasets` or scikit-learn.
evals = [
    "datasets>=2.18",
    "scikit-learn>=1.3",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]
all = [
    "scaffolder[embeddings,voyage,dashboard,evals,dev]",
]

[project.scripts]
scaffolder = "scaffolder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "lexichunk.*",
    "langchain_text_splitters.*",
    "sentence_transformers.*",
    "faiss.*",
    "voyageai.*",
    "streamlit.*",
    "plotly.*",
    "datasets.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scaffolder --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/scaffolder"]
omit = ["src/scaffolder/dashboard/*"]
