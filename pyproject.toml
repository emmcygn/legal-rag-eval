[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffolder"
version = "1.0.0"
description = "Evaluation harness for legal-document chunking: anchored-evidence retrieval, gold-scored structural fidelity, and external LEDGAR/CUAD evaluations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "SDK Scaffolder Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LexiChunk is not published on PyPI. Installing it by version specifier
    # ("lexichunk>=0.1.0,<1.0") fails with 404, which breaks `pip install -e .`
    # and every CI job, so pull it from source. Pinned to an exact commit rather
    # than a branch so a clean clone resolves to the build these results were
    # produced against. To develop against a local checkout, install the direct
    # reference first and the editable one LAST -- installing the extras after the
    # editable silently replaces it with the pinned wheel:
    #     pip install -e ".[dev]" && pip install -e ../lexichunk
    "lexichunk @ git+https://github.com/emmcygn/lexichunk.git@397274a289e31eeb420a9c65d1e98c70db978d34",
    "langchain-text-splitters>=1.1.2,<2",
    "rich>=13.0,<14.0",
    "pyyaml>=6.0,<7.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<2.0",
    "jinja2>=3.1,<4.0",
    # scaffolder.reporting.html imports plotly at module scope and `scaffolder
    # report` is a documented command, so plotly is a core dependency, not a
    # dashboard-only one.
    "plotly>=5.18,<8",
    # scaffolder.retrieval.index imports faiss at module scope, and
    # scaffolder.retrieval.simulator (which every query-annotation check goes
    # through) imports that. Listing it under the `embeddings` extra meant
    # `pip install -e ".[dev]" && make test` -- the documented developer setup and
    # what CI runs -- could not even collect three test modules. FAISS is the
    # harness's own index, not part of the model runtime.
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2",
]
voyage = [
    "voyageai>=0.2",
]
dashboard = [
    "streamlit>=1.30",
]
dev = [
    "build>=1.2,<2",
    "faiss-cpu>=1.7,<2",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]
all = [
    "scaffolder[embeddings,voyage,dashboard,dev]",
]

[project.scripts]
scaffolder = "scaffolder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scaffolder = [
    "data/*.json",
    "data/documents/*.txt",
    "fixtures/documents/*.txt",
    "reporting/templates/*.j2",
]

[tool.setuptools.data-files]
"share/scaffolder/queries" = ["queries/*.yaml", "queries/schema.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "lexichunk.*",
    "langchain_text_splitters.*",
    "sentence_transformers.*",
    "scipy.optimize",
    "torch.*",
    "faiss.*",
    "voyageai.*",
    "streamlit.*",
    "plotly.*",
    # `_pin_seeds` imports torch opportunistically. It arrives with the
    # `embeddings` extra, so on a CI runner that installs `[dev]` only, mypy
    # would fail on an import the code already guards with try/except ImportError.
    "torch.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `strict` turns on no_implicit_reexport, which applies to third-party packages too:
# `voyageai.Client` is re-exported from a submodule without `__all__`, so with voyageai
# installed mypy rejects it while a runner without the `voyage` extra sees only `Any`.
# The result was a typecheck that passed in CI and failed on a developer's machine.
module = ["voyageai.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scaffolder --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/scaffolder"]
# The Streamlit dashboard is excluded: it is UI glue exercised only by the dashboard
# smoke workflow, and including it would flatter the coverage figure by ~1,700 statements.
omit = ["src/scaffolder/dashboard/*"]
