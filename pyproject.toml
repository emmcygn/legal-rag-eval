[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-eval"
version = "1.0.0"
description = "Evaluation harness for legal-document chunking: anchored-evidence retrieval, gold-scored structural fidelity, and external LEDGAR/CUAD evaluations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Emmanuel Cuyugan"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LexiChunk is published on PyPI as of 0.9.0, so it is a normal version
    # specifier again. It used to be a pinned git reference, because installing it
    # by version resolved to a PyPI 404 and broke `pip install -e .` and every CI
    # job. The floor is the release the committed runs in results/ were produced
    # against; the ceiling stops a minor release from silently changing the
    # chunker under a published number. Every result file also records the
    # `lexichunk_version` that produced it, so provenance does not rely on this
    # line alone.
    #
    # To compare a local LexiChunk checkout against the released build, install the
    # extras FIRST and the editable checkout LAST -- installing the extras after the
    # editable silently replaces it with the released wheel:
    #     pip install -e ".[dev]" && pip install -e ../lexichunk
    "lexichunk>=0.9.0,<0.10",
    "langchain-text-splitters>=1.1.2,<2",
    "rich>=13.0,<14.0",
    "pyyaml>=6.0,<7.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<2.0",
    "jinja2>=3.1,<4.0",
    # legal_rag_eval.reporting.html imports plotly at module scope and `legal_rag_eval
    # report` is a documented command, so plotly is a core dependency, not a
    # dashboard-only one.
    "plotly>=5.18,<8",
    # legal_rag_eval.retrieval.index imports faiss at module scope, and
    # legal_rag_eval.retrieval.simulator (which every query-annotation check goes
    # through) imports that. Listing it under the `embeddings` extra meant
    # `pip install -e ".[dev]" && make test` -- the documented developer setup and
    # what CI runs -- could not even collect three test modules. FAISS is the
    # harness's own index, not part of the model runtime.
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2",
]
voyage = [
    "voyageai>=0.2",
]
dashboard = [
    "streamlit>=1.30",
]
# External, public-dataset evaluations (legal_rag_eval.evals). Kept optional so the
# core benchmark does not drag in Hugging Face `datasets` or scikit-learn.
evals = [
    "datasets>=2.18",
    "scikit-learn>=1.3",
]
dev = [
    "build>=1.2,<2",
    "faiss-cpu>=1.7,<2",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]
all = [
    "legal-rag-eval[embeddings,voyage,dashboard,evals,dev]",
]

[project.scripts]
# The console script is the hyphenated distribution name; `python -m
# legal_rag_eval` reaches the same entry point and stays supported.
legal-rag-eval = "legal_rag_eval.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legal_rag_eval = [
    "data/*.json",
    "data/documents/*.txt",
    "fixtures/documents/*.txt",
    "reporting/templates/*.j2",
]

[tool.setuptools.data-files]
# The gold annotations and the queries anchored to them are data a consumer of an
# installed wheel needs in order to reproduce a published number, so they ship
# alongside the package rather than living only in the repo.
"share/legal-rag-eval/queries" = ["queries/*.yaml", "queries/schema.md"]
"share/legal-rag-eval/gold" = ["gold/*.json", "gold/SCHEMA.md", "gold/README.md"]
"share/legal-rag-eval/evals" = ["evals/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "lexichunk.*",
    "langchain_text_splitters.*",
    "sentence_transformers.*",
    "scipy.optimize",
    "torch.*",
    "faiss.*",
    "voyageai.*",
    "streamlit.*",
    "plotly.*",
    # `_pin_seeds` imports torch opportunistically. It arrives with the
    # `embeddings` extra, so on a CI runner that installs `[dev]` only, mypy
    # would fail on an import the code already guards with try/except ImportError.
    "torch.*",
    # Both arrive with the `evals` extra and are imported lazily inside the
    # external-evaluation loaders, for the same reason.
    "datasets.*",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `strict` turns on no_implicit_reexport, which applies to third-party packages too:
# `voyageai.Client` is re-exported from a submodule without `__all__`, so with voyageai
# installed mypy rejects it while a runner without the `voyage` extra sees only `Any`.
# The result was a typecheck that passed in CI and failed on a developer's machine.
module = ["voyageai.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=legal_rag_eval --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/legal_rag_eval"]
# The Streamlit dashboard is excluded: it is UI glue exercised only by the dashboard
# smoke workflow, and including it would flatter the coverage figure by ~1,700 statements.
omit = ["src/legal_rag_eval/dashboard/*"]
