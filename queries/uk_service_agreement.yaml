document_id: uk_service_agreement
queries:
  - id: uk_sa_q1
    text: "How does this agreement define what counts as a party's 'Affiliate'?"
    category: definition_lookup
    relevant_clauses:
      - identifier: "1.1"
        relevance: 3
        description: "Clause 1.1 — the definitions clause, which includes the 'Affiliate' definition (control via >50% ownership or power to direct management)."
    notes: >
      All defined terms in this contract sit inside a single undivided gold clause
      (1.1), so any definition question resolves to the same identifier. 'Affiliate'
      is defined by reference to '"control" means the ownership of more than fifty
      percent (50%) of the voting securities ...'.

  - id: uk_sa_q2
    text: "If one of the Client's employees misuses the Supplier's services, who is responsible for that?"
    category: clause_lookup
    relevant_clauses:
      - identifier: "2.5(c)"
        relevance: 3
        description: "Clause 2.5(c) — the Client is responsible for the acts and omissions of Authorised Users."
    notes: >
      Clause 2.5(c) makes the Client "responsible for the acts and omissions of the
      Authorised Users in relation to the Services". The query uses "employees" and
      "misuses" rather than the document's own "Authorised Users" / "acts and
      omissions" so a purely lexical match doesn't trivially win.

  - id: uk_sa_q3
    text: "How much advance notice must the Supplier give before it can increase its fees, and is there a limit on how big that increase can be?"
    category: numeric_lookup
    relevant_clauses:
      - identifier: "3.7"
        relevance: 3
        description: "Clause 3.7 — Supplier may increase Fees annually on 60 days' notice, capped at the greater of 5% or UK CPI increase."
    notes: >
      Clause 3.7: "not less than sixty (60) days' prior written notice ... shall not
      exceed the greater of (i) five percent (5%) or (ii) the percentage increase in
      the UK Consumer Price Index". Two numbers are needed for a complete answer
      (notice period and cap), both inside the same clause.

  - id: uk_sa_q4
    text: "If the Client disputes part of an invoice, do they still have to pay the rest of it while the dispute is being sorted out?"
    category: conditional
    relevant_clauses:
      - identifier: "3.6(a)"
        relevance: 3
        description: "Clause 3.6(a) — the Client must pay the undisputed portion of the invoice by the Payment Due Date."
      - identifier: "3.6(b)"
        relevance: 2
        description: "Clause 3.6(b) — the Client must also notify the Supplier in writing of the grounds for the dispute."
    notes: >
      Clause 3.6(a) directly answers "yes, pay the undisputed part by the normal due
      date"; 3.6(b) is the necessary second half of the good-faith dispute procedure
      (notifying the grounds for dispute).

  - id: uk_sa_q5
    text: "If the Client falls behind on payment, can the Supplier stop delivering the services, and could that also lead to the contract being ended altogether?"
    category: multi_clause
    relevant_clauses:
      - identifier: "3.4(b)"
        relevance: 3
        description: "Clause 3.4(b) — after 15 Business Days' notice of non-payment, the Supplier may suspend the Services."
      - identifier: "6.4"
        relevance: 2
        description: "Clause 6.4 — the Supplier may terminate the Agreement in accordance with clause 3.4(b) following the Client's failure to pay."
    notes: >
      Clause 3.4(b) (Fees, clause 3) governs suspension; clause 6.4 (Term and
      termination, clause 6) explicitly cross-references 3.4(b) to escalate
      non-payment into a full termination right. The two clauses are not adjacent —
      one lives under Fees, the other under Termination — so neither alone answers
      the "could this end the contract" half of the question.

  - id: uk_sa_q6
    text: "The termination clause says the confidentiality obligations survive the end of the contract — but how long do those obligations actually last once the agreement ends?"
    category: cross_reference
    relevant_clauses:
      - identifier: "4.5"
        relevance: 3
        description: "Clause 4.5 — confidentiality obligations survive termination for a period of five (5) years."
      - identifier: "6.5(d)"
        relevance: 2
        description: "Clause 6.5(d) — on termination, provisions intended to survive (including clause 4) continue in force; this is the clause that points the reader to clause 4."
    notes: >
      Clause 6.5(d) names clause 4 as one of the clauses surviving termination
      (matches the gold cross-reference at char 17427, target identifier "4"), but
      the actual survival period ("a period of five (5) years") is only stated in
      clause 4.5 itself.
