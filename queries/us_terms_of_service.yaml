document_id: us_terms_of_service
queries:
  - id: us_tos_q1
    text: "How does Strata define 'Personal Information' under these terms?"
    category: definition_lookup
    relevant_clauses:
      - identifier: "section_1.7"
        relevance: 3
        description: "Section 1.7 — 'Personal Information' means information identifying a natural person, as defined under applicable privacy laws including CCPA/CPRA."
    notes: >
      Section 1.7 ties the definition to "applicable privacy laws including the
      California Consumer Privacy Act ... and other applicable federal and state
      privacy statutes" — each definition here is its own leaf clause, unlike the UK
      fixtures.

  - id: us_tos_q2
    text: "If I stop using Strata's product, can I still get my data out before it's gone for good?"
    category: clause_lookup
    relevant_clauses:
      - identifier: "section_4.5"
        relevance: 3
        description: "Section 4.5 (Data Retention and Deletion) — Customer Content is available for export for 30 days after termination, then may be deleted."
    notes: >
      Section 4.5: "Strata will make Customer Content available for export for
      thirty (30) days following termination, after which Strata may delete Customer
      Content from its systems."

  - id: us_tos_q3
    text: "What's the maximum amount Strata could ever be required to pay out if something went wrong, and is there a guaranteed minimum regardless of how little I've spent?"
    category: numeric_lookup
    relevant_clauses:
      - identifier: "section_9.2"
        relevance: 3
        description: "Section 9.2 (Cap on Liability) — liability is capped at the greater of the prior 12 months' Subscription Fees or $100."
    notes: >
      Section 9.2 caps liability at "THE GREATER OF: (A) THE TOTAL SUBSCRIPTION FEES
      ACTUALLY PAID ... OR (B) ONE HUNDRED U.S. DOLLARS ($100)". Both prongs sit
      inside the same parent clause (9.2(a) and 9.2(b)), so naming the parent gives
      a complete answer without inflating the relevant span.

  - id: us_tos_q4
    text: "If I get sued because content I uploaded infringed someone's copyright, is that something I have to defend myself against or does Strata step in?"
    category: conditional
    relevant_clauses:
      - identifier: "section_10.2"
        relevance: 3
        description: "Section 10.2 (Indemnification by Customer) — Customer must indemnify Strata for claims arising from Customer Content, including infringement allegations."
    notes: >
      Section 10.2(a): Customer indemnifies Strata for claims arising from "Customer
      Content, including any allegation that Customer Content infringes any
      third-party rights" — i.e. the Customer bears this risk, not Strata.

  - id: us_tos_q5
    text: "If Strata ends my subscription because I violated the content rules, do I get anything back for the unused part of my term, and which parts of the contract keep applying afterward?"
    category: multi_clause
    relevant_clauses:
      - identifier: "section_5.6"
        relevance: 3
        description: "Section 5.6 (No Refunds) — fees are non-refundable except as set out in Section 7.4 (which only applies to Customer-initiated termination for Strata's breach)."
      - identifier: "section_7.5(d)"
        relevance: 2
        description: "Section 7.5(d) — lists which Sections survive termination."
    notes: >
      Section 5.6 answers the refund half (no refund; the only carve-out, 7.4, does
      not apply to a Strata-initiated termination for the Customer's own breach), and
      7.5(d) answers the survival half. The two clauses are in non-adjacent Sections
      (5 and 7) and neither alone answers both parts of the question.

  - id: us_tos_q6
    text: "Termination for cause because I violated the platform's usage rules could be based on two different sets of restrictions elsewhere in the contract — what do those restrictions actually prohibit?"
    category: cross_reference
    relevant_clauses:
      - identifier: "section_3.1"
        relevance: 3
        description: "Section 3.1 (Prohibited Content) — one of the two restrictions Section 7.3(c) points to: illegal, infringing, malicious, privacy-violating, or misleading content."
      - identifier: "section_2.2"
        relevance: 2
        description: "Section 2.2 (Restrictions) — the other restriction Section 7.3(c) points to: copying, reverse engineering, reselling, competitive use, etc."
      - identifier: "section_7.3(c)"
        relevance: 1
        description: "Section 7.3(c) — the termination-for-cause ground that cross-references Section 2.2 and Section 3.1."
    notes: >
      Section 7.3(c) grounds termination for cause on "Customer violates Section 2.2
      or Section 3.1" (matching the two gold cross-references at char 14845 and
      14860). A complete answer needs both referenced sections, not just the
      triggering clause.
