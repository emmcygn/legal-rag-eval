name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # lexichunk is not on PyPI; pyproject pins it as a direct git reference, so pip
      # clones it here. This is what makes `pip install -e ".[dev]"` work on a clean
      # runner at all -- the previous version specifier resolved to a PyPI 404.
      - run: pip install -e ".[dev]"
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: make test

  gold-annotations:
    # The gold annotations are the structural ground truth. If a fixture changes, every
    # span in gold/ silently becomes wrong, so validate them on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Validate gold annotations and query references
        run: python -m pytest tests/test_gold_annotations.py tests/test_query_annotations.py -q --no-cov
      - name: Validate the anchored-evidence dataset
        run: python -m pytest tests/test_evidence_schema.py -q --no-cov
      # The README's results tables are generated from the committed run. If someone edits
      # them by hand, or replaces the run without regenerating, this catches it.
      - name: README results section matches the committed run
        run: make readme-check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install wheel in isolation
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install dist/*.whl
      - name: Verify packaged assets
        run: |
          wheel-venv/bin/python - <<'PY'
          import importlib.resources
          import pathlib
          import sys

          package = importlib.resources.files("scaffolder")
          assert package.joinpath("data/synthetic_contracts_v1.json").is_file()
          assert package.joinpath("data/documents/synthetic_supply_agreement.txt").is_file()
          assert package.joinpath("fixtures/documents/uk_service_agreement.txt").is_file()
          assert package.joinpath("reporting/templates/report.html.j2").is_file()
          assert (pathlib.Path(sys.prefix) / "share/scaffolder/queries/schema.md").is_file()
          assert (pathlib.Path(sys.prefix) / "share/scaffolder/gold/us_msa.json").is_file()
          PY
      - name: Run installed wheel benchmark offline
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/wheel-venv/bin/python" -m scaffolder benchmark --output evidence.json
          "$GITHUB_WORKSPACE/wheel-venv/bin/python" -c "import json; data=json.load(open('evidence.json')); assert data['report_version']=='evidence_benchmark_report_v1'"

  benchmark-smoke:
    # Anchored-evidence plus gold-scored structural benchmarks: no model downloads, runs
    # in seconds. The retrieval benchmark pulls sentence-transformer weights, so it is
    # workflow_dispatch only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Anchored-evidence benchmark
        run: make benchmark
      - name: Structural benchmark
        run: make benchmark-structural
      - name: HTML report
        run: make report
      - uses: actions/upload-artifact@v4
        with:
          name: offline-benchmarks
          path: results/
          if-no-files-found: error

  evals-smoke:
    # The external LEDGAR/CUAD evaluations download public datasets, so CI only exercises
    # their offline synthetic path. The numbers it produces are meaningless by design.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/test_evals_chunkers.py tests/test_evals_cli.py tests/test_evals_label_map.py tests/test_evals_metrics.py -q --no-cov

  windows-newline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_evidence_schema.py tests/test_gold_annotations.py --no-cov
      - run: python -m scaffolder benchmark --output results/evidence-benchmark.json

  benchmark-retrieval:
    # Manual only: downloads embedding model weights (hundreds of MB) and takes minutes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[embeddings,dev]"
      - name: Full retrieval benchmark
        run: python -m scaffolder benchmark-embed --json --seed 42
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: results/
          if-no-files-found: error
