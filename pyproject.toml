[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffolder"
version = "1.0.0"
description = "Deterministic source-anchored evidence evaluation for legal RAG chunking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "SDK Scaffolder Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "lexichunk @ git+https://github.com/emmcygn/lexichunk.git@397274a289e31eeb420a9c65d1e98c70db978d34",
    "langchain-text-splitters>=1.1.2,<2",
    "rich>=13.0,<14.0",
    "pyyaml>=6.0,<7.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<2.0",
    "jinja2>=3.1,<4.0",
    "plotly>=5.18,<8",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
]
voyage = [
    "voyageai>=0.2",
]
dashboard = [
    "streamlit>=1.30",
]
dev = [
    "build>=1.2,<2",
    "faiss-cpu>=1.7,<2",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]
all = [
    "scaffolder[embeddings,voyage,dashboard,dev]",
]

[project.scripts]
scaffolder = "scaffolder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scaffolder = [
    "data/*.json",
    "data/documents/*.txt",
    "fixtures/documents/*.txt",
    "reporting/templates/*.j2",
]

[tool.setuptools.data-files]
"share/scaffolder/queries" = ["queries/*.yaml", "queries/schema.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "lexichunk.*",
    "langchain_text_splitters.*",
    "sentence_transformers.*",
    "scipy.optimize",
    "torch.*",
    "faiss.*",
    "voyageai.*",
    "streamlit.*",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scaffolder --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/scaffolder"]
omit = ["src/scaffolder/dashboard/*"]
